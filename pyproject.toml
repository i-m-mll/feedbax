[project]
name = "feedbax"
version = "0.2.0"
description = "Optimal feedback control + interventions in JAX."
# url = ""
authors = [
    {name = "MLL", email = "mll@mll.bio"}
]
license = {file = "LICENSE"}
readme = "README.md"
keywords = [
    'jax',
    'neural-networks',
    'optimal-control',
    'optimal-feedback-control',
    'pytorch',
    'biomechanics',
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "crc32c>=2.7.1",
    "diffrax>=0.7.0",
    "equinox>=0.11.12",
    "jax>=0.5.2",
    "jaxtyping>=0.2.38",
    "numpy>=2.2.3",
    "optax>=0.2.4",
    "optimistix>=0.0.10",
    "pydantic>=2.0",
    "rich>=13.9.4",
    "ruamel-yaml>=0.18.0",
    "treescope>=0.1.1",
    "tqdm>=4.67.1",
    "jax-cookbook",
]

[project.optional-dependencies]
analysis = [
    "dill>=0.3.9",
    "plotly>=6.0.0",
    "pyperclip>=1.9.0",
    "rich>=13.9.4",
    "scikit-learn>=1.6.1",
    "sqlalchemy>=2.0",
]
config = [
    "ruamel-yaml>=0.18.0",
]
persistence = [
    "alembic>=1.15.1",
    "matplotlib>=3.10.1",
    "plotly>=6.0.0",
    "pyexiv2>=2.15.3",
    "sqlalchemy>=2.0",
]
training = [
    "rich>=13.9.4",
    "sqlalchemy>=2.0",
    "tensorboardx>=2.6.2.2",
]
viz = [
    "kaleido==0.2.1",
    "matplotlib>=3.10.1",
    "pandas>=2.1.0",
    "plotly>=6.0.0",
    "polars>=1.24.0",
    "pyexiv2>=2.15.3",
    "pyperclip>=1.9.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
]
web = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.29.0",
]
notebook = [
    "ipyfilechooser>=0.6.0",
    "ipywidgets>=8.1.5",
    "notebook>=7.4.1",
    "plotly>=6.0.0",
    "ruamel-yaml>=0.18.0",
]
plotlyviewer = [
    "pyqt5>=5.15.11",
    "pyqtwebengine>=5.15.7",
    "ruamel-yaml>=0.18.0",
]
mjx = [
    "mujoco>=3.0.0",
    "mujoco-mjx>=0.1.0",
]
all = [
    "alembic>=1.15.1",
    "dill>=0.3.9",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "ipyfilechooser>=0.6.0",
    "ipywidgets>=8.1.5",
    "kaleido==0.2.1",
    "matplotlib>=3.10.1",
    "mujoco>=3.0.0",
    "mujoco-mjx>=0.1.0",
    "notebook>=7.4.1",
    "pandas>=2.1.0",
    "plotly>=6.0.0",
    "polars>=1.24.0",
    "pyexiv2>=2.15.3",
    "pyperclip>=1.9.0",
    "pyqt5>=5.15.11",
    "pyqtwebengine>=5.15.7",
    "rich>=13.9.4",
    "ruamel-yaml>=0.18.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0",
    "tensorboardx>=2.6.2.2",
    "uvicorn>=0.29.0",
]

[project.scripts]
feedbax = "feedbax.cli:main"
feedbax-run = "feedbax.bin.run:main"
feedbax-analysis = "feedbax.bin.analysis:main"
feedbax-figure = "feedbax.bin.figure:main"
feedbax-train = "feedbax.bin.train:main"
feedbax-provider = "feedbax.bin.provider:main"
feedbax-orchestrate = "feedbax.bin.orchestrate:main"

[project.urls]
repository = "https://github.com/i-m-mll/feedbax"
documentation = "https://docs.lprt.ca/feedbax"

[tool.uv]
config-settings = { editable-mode = "compat" }

[tool.uv.sources]
jax-cookbook = { git = "https://github.com/i-m-mll/jax-cookbook.git", rev = "4db33dc7a1401f50335f96e18f8f5d704f26b919" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mujoco>=3.0.0",
    "mujoco-mjx>=0.1.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.11",
]

[tool.hatch.build.targets.sdist]
packages = ["feedbax"]

[tool.hatch.build.targets.wheel]
packages = ["feedbax"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pyright]
include = ["feedbax", "tests"]
exclude = ["**/__pycache__", ".venv", ".claude"]
typeCheckingMode = "standard"
verboseOutput = true
reportMissingImports = true
reportMissingTypeStubs = true
# Temporary:
# reportAttributeAccessIssue = false

[tool.black]
target-version = ['py310', 'py311', 'py312']
include = 'feedbax\/.*\.pyi?$'
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -n auto -m 'not optional_mjx and not optional_ppo'"
markers = [
    "slow: tests that are too expensive for every local or CI pass",
    "optional_mjx: MJX simulation and integration tests run only when explicitly selected",
    "optional_ppo: PPO rollout and training tests run only when explicitly selected",
    "feedbax_contract: Feedbax contract-surface tests for downstream consumers",
    "graph_spec_contract: GraphSpec schema, migration, and runtime contract tests",
    "provider_contract: provider API and manifest contract tests",
    "worker_contract: worker method, phase, checkpoint, and execution contract tests",
    "migration_contract: durable structured-spec migration and rejection tests",
    "analysis_recipe_contract: analysis, evaluation, report, and regeneration contract tests",
    "no_silent_substitution_contract: structural gate for silent default/fallback patterns",
]

[tool.ruff]
cache-dir = "~/.cache/ruff"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Equinox array annotations
ignore = ["F722"]
# Prevent removal of unused imports
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
# Scripts often need to run things before importing more things
"feedbax/bin/*.py" = ["E402"]

[tool.ruff.format]
indent-style = "space"
