name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Check lockfile
        run: uv lock --check

      - name: Check generated Studio contracts
        run: |
          uv run python scripts/generate_studio_contracts.py
          git diff --exit-code web/src/generated/studioContracts.ts

      - name: Run bootstrap regression and contract tests
        run: uv run pytest tests/test_batch_reshape_nan_bypass.py tests/test_studio_api_contracts.py -q

      - name: Run ruff
        run: uv run ruff check scripts/generate_studio_contracts.py tests/test_batch_reshape_nan_bypass.py tests/test_studio_api_contracts.py

      - name: Run pyright
        run: uv run pyright tests/test_batch_reshape_nan_bypass.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
