[package]
name = "feedbax-studio"
version = "0.0.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.10.2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
window-shell-geometry = { path = "../../vendor/window-shell/native-geometry", features = ["appkit"] }
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString", "NSNotification", "NSOperation", "block2"] }
objc2-service-management = "0.3.2"

[profile.release]
debug = false
strip = "debuginfo"

[profile.release.build-override]
strip = "none"
