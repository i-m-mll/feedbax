[package]
name = "feedbax-studio"
version = "0.0.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.10.2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-service-management = "0.3.2"

[profile.release]
debug = false
strip = "debuginfo"

[profile.release.build-override]
strip = "none"
