[[permission]]
identifier = "allow-publish-studio-menu"
description = "Publish commands for the registered Studio project webview."
commands.allow = ["publish_studio_menu"]

[[permission]]
identifier = "allow-studio-window-action"
description = "Drag, zoom, or name the registered Studio project webview."
commands.allow = ["studio_window_action"]

[[permission]]
identifier = "allow-open-project-folder"
description = "Choose a project folder from the registered Studio start webview."
commands.allow = ["open_project_folder"]

[[permission]]
identifier = "allow-save-studio-file"
description = "Save a file the registered Studio project webview hands over, where the user chooses."
commands.allow = ["save_studio_file"]
